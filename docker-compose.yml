version: '3.8'

services:
  aegis-quant-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: aegis_quant_bot
    restart: unless-stopped
    environment:
      - BOT_HOST=http://localhost:3000
      - SCAN_INTERVAL_SEC=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DATABASE_URL=${DATABASE_URL:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
